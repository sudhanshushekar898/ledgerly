# Local development stack. Credentials here are throwaway and local-only.
# Host port 5433 so it does not clash with a local PostgreSQL on 5432.
name: ledgerly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers use kafka:9092; the host uses localhost:9094.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared by the app (partitions, DLT)
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    build: ./backend
    profiles: ["full"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerly
      DB_USER: ledgerly
      DB_PASSWORD: ledgerly
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Reconcile every 15 s locally so a broken ledger shows up in Grafana within a minute (default 60 s).
      LEDGERLY_RECONCILIATION_INTERVAL: 15s
      # Local stack only: tokens are signed with a key generated at startup. Never set this in a real deployment.
      LEDGERLY_SECURITY_JWT_ALLOW_EPHEMERAL_KEY: "true"
      # Local stack only: synthetic operator login (allowlisted in .gitleaks.toml). Real deployments inject secrets.
      LEDGERLY_BOOTSTRAP_ADMIN_EMAIL: operator@example.com
      LEDGERLY_BOOTSTRAP_ADMIN_PASSWORD: Local-Operator-Pass-2026
      # Local stack only: seed 60 days of synthetic history for the demo customer asha@demo.example.com, once.
      LEDGERLY_DEMO_SEED: "true"
      LEDGERLY_DEMO_PASSWORD: Demo-Wallet-Pass-2026
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Observability. Prometheus scrapes the backend and evaluates ops/prometheus/alerts.yml.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["full"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # Grafana with the Ledgerly dashboard provisioned from files; anonymous read-only for the local demo.
  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["full"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ledgerly.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # The SPA behind Nginx, which also proxies /api to the backend (same origin, like production).
  frontend:
    build: ./frontend
    profiles: ["full"]
    ports:
      - "8091:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
