# Every alert links to a section of docs/RUNBOOK.md: what it means, how to confirm, what to do.
groups:
  - name: ledgerly-money
    rules:
      - alert: LedgerOutOfBalance
        expr: ledger_reconciliation_healthy == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Ledger reconciliation failed: money may have been created or lost"
          description: "{{ $value }} healthy flag; total of all balances is {{ with query \"ledger_total_balance\" }}{{ . | first | value }}{{ end }} INR."
          runbook: "docs/RUNBOOK.md#ledgeroutofbalance"

      - alert: ReconciliationStale
        expr: time() - ledger_reconciliation_last_run > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The reconciliation job has not completed for over 5 minutes"
          runbook: "docs/RUNBOOK.md#reconciliationstale"

  - name: ledgerly-events
    rules:
      - alert: EventsDeadLettered
        expr: increase(notifications_dead_lettered_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} event(s) parked on wallet.money-moved.DLT in the last 10 minutes"
          runbook: "docs/RUNBOOK.md#eventsdeadlettered"

      - alert: OutboxBacklog
        expr: outbox_oldest_age_seconds > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Oldest unpublished outbox event is {{ $value | humanizeDuration }} old: events are not reaching Kafka"
          runbook: "docs/RUNBOOK.md#outboxbacklog"

  - name: ledgerly-api
    rules:
      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 2% of API requests fail with 5xx"
          runbook: "docs/RUNBOOK.md#highservererrorrate"

      - alert: SlowApi
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 500 ms for 10 minutes"
          runbook: "docs/RUNBOOK.md#slowapi"
